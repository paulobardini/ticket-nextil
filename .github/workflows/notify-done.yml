name: Notify on ticket done

on:
  schedule:
    - cron: '*/5 * * * *'    # roda a cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GH_TOKEN:   ${{ secrets.NEXTIL_GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          missing=()
          [ -z "$GH_TOKEN" ]   && missing+=("NEXTIL_GITHUB_TOKEN")
          [ -z "$GMAIL_USER" ] && missing+=("GMAIL_USER")
          [ -z "$GMAIL_PASS" ] && missing+=("GMAIL_PASS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes ou vazios: ${missing[*]}"
            exit 1
          fi

      - name: Check done tickets and send emails
        env:
          GH_TOKEN:   ${{ secrets.NEXTIL_GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python3 notify_done.py

      - name: Commit sent_emails tracking file
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add sent_emails.txt
          git diff --staged --quiet || (git commit -m "chore: update sent emails log [skip ci]" && git push)
